<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Occam-Kit — Scientific, Token-Frugal Universal Agent Harness">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30D158"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FF9F0A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="378" rx="19" fill="none" stroke="#27272A" stroke-width="2"/>

  <!-- Subtle grid dots -->
  <g fill="#27272A" opacity="0.5">
    <circle cx="48" cy="44" r="2"/><circle cx="72" cy="44" r="2"/><circle cx="96" cy="44" r="2"/>
    <circle cx="1104" cy="44" r="2"/><circle cx="1128" cy="44" r="2"/><circle cx="1152" cy="44" r="2"/>
  </g>

  <!-- Title & tagline -->
  <text x="64" y="92" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" letter-spacing="-1.2">occam-kit</text>
  <rect x="312" y="58" width="194" height="30" rx="15" fill="#14291C" stroke="#30D158" stroke-width="1"/>
  <text x="409" y="78" text-anchor="middle" fill="#30D158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">ZERO-DEP · OPEN SPEC</text>

  <text x="64" y="132" fill="#D4D4D8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
    Scientific, token-frugal agent harness for Claude Code, Codex CLI, Cursor, Gemini CLI &amp; Antigravity.
  </text>

  <rect x="64" y="156" width="1072" height="2" fill="url(#accent)" opacity="0.45"/>

  <!-- 4 Pipeline Cards -->
  <!-- Card 1 -->
  <g transform="translate(64, 184)">
    <rect width="248" height="148" rx="12" fill="#141417" stroke="#27272A" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="6" fill="#30D158"/>
    <text x="42" y="33" fill="#30D158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">PHASE 1 · ANALYZE</text>
    <text x="20" y="64" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Socratic Brainstorm</text>
    <text x="20" y="92" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">3–5 surgical questions.</text>
    <text x="20" y="112" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Exposes contradictions</text>
    <text x="20" y="132" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">&amp; locks a 1-page spec.</text>
  </g>

  <!-- Arrow 1 -->
  <text x="323" y="264" fill="#52525B" font-family="ui-monospace, monospace" font-size="22" font-weight="700">→</text>

  <!-- Card 2 -->
  <g transform="translate(342, 184)">
    <rect width="248" height="148" rx="12" fill="#141417" stroke="#27272A" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="6" fill="#30D158"/>
    <text x="42" y="33" fill="#30D158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">PHASE 2 · VERIFY</text>
    <text x="20" y="64" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Research Gate</text>
    <text x="20" y="92" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Primary T1 sources only.</text>
    <text x="20" y="112" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">Machine-checked ledger</text>
    <text x="20" y="132" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">blocks hallucinated APIs.</text>
  </g>

  <!-- Arrow 2 -->
  <text x="601" y="264" fill="#52525B" font-family="ui-monospace, monospace" font-size="22" font-weight="700">→</text>

  <!-- Card 3 -->
  <g transform="translate(620, 184)">
    <rect width="248" height="148" rx="12" fill="#141417" stroke="#27272A" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="6" fill="#FF9F0A"/>
    <text x="42" y="33" fill="#FF9F0A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">PHASE 3 · ROUTE</text>
    <text x="20" y="64" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Minimum Capability</text>
    <text x="20" y="92" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">T0 scripts → T1 small →</text>
    <text x="20" y="112" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">T2 standard → T3 frontier</text>
    <text x="20" y="132" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">only when escalation earned.</text>
  </g>

  <!-- Arrow 3 -->
  <text x="879" y="264" fill="#52525B" font-family="ui-monospace, monospace" font-size="22" font-weight="700">→</text>

  <!-- Card 4 -->
  <g transform="translate(898, 184)">
    <rect width="238" height="148" rx="12" fill="#141417" stroke="#27272A" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="6" fill="#30D158"/>
    <text x="42" y="33" fill="#30D158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">TIER 0 · 0 TOKENS</text>
    <text x="20" y="64" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Local Stdlib Tools</text>
    <text x="20" y="92" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">occam map · occam run</text>
    <text x="20" y="112" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">occam ledger · occam cite</text>
    <text x="20" y="132" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">No context poisoning.</text>
  </g>
</svg>
