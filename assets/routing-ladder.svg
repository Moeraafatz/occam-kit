<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Occam-Kit Four-Tier Minimum-Capability Routing Ladder">
  <defs>
    <linearGradient id="bgRoute" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#111318"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" rx="20" fill="url(#bgRoute)"/>
  <rect x="1" y="1" width="1198" height="498" rx="19" fill="none" stroke="#27272A" stroke-width="2"/>

  <!-- Header -->
  <text x="52" y="54" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="28" font-weight="800">Minimum-Capability Routing Ladder</text>
  <text x="52" y="82" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">Start at the cheapest tier that solves the step. Escalate only on earned evidence; drop right back down.</text>

  <!-- 80/15/5 pill -->
  <rect x="920" y="34" width="228" height="42" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1.2"/>
  <text x="1034" y="60" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">TARGET MIX: 80% · 15% · 5%</text>

  <!-- Tier 0 -->
  <g transform="translate(52, 112)">
    <rect width="1096" height="72" rx="12" fill="#102116" stroke="#30D158" stroke-width="1.5"/>
    <rect x="16" y="16" width="96" height="40" rx="8" fill="#30D158"/>
    <text x="64" y="42" text-anchor="middle" fill="#09090B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">TIER 0</text>
    <text x="132" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Local Deterministic Scripts (occam.py, rg, linters, compilers)</text>
    <text x="132" y="56" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Repo symbol maps · Test/build log reduction · State ledger &amp; handoff · Citation validation</text>
    <rect x="938" y="20" width="140" height="32" rx="16" fill="#09090B" stroke="#30D158" stroke-width="1"/>
    <text x="1008" y="41" text-anchor="middle" fill="#30D158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800">0 LLM TOKENS</text>
  </g>

  <!-- Tier 1 -->
  <g transform="translate(52, 198)">
    <rect width="1096" height="72" rx="12" fill="#141417" stroke="#30D158" stroke-width="1.2" stroke-opacity="0.65"/>
    <rect x="16" y="16" width="96" height="40" rx="8" fill="#14291C" stroke="#30D158" stroke-width="1.2"/>
    <text x="64" y="42" text-anchor="middle" fill="#30D158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">TIER 1</text>
    <text x="132" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Small / Fast Models (Haiku · Flash · Mini · Local 7B–14B)</text>
    <text x="132" y="56" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Targeted file discovery · Boilerplate · Mechanical refactors · Simple test scaffolds · Docs</text>
    <rect x="938" y="20" width="140" height="32" rx="16" fill="#14291C"/>
    <text x="1008" y="41" text-anchor="middle" fill="#86EFAC" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">1x BASE COST</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(52, 284)">
    <rect width="1096" height="72" rx="12" fill="#141417" stroke="#FF9F0A" stroke-width="1.2" stroke-opacity="0.75"/>
    <rect x="16" y="16" width="96" height="40" rx="8" fill="#2A1F0D" stroke="#FF9F0A" stroke-width="1.2"/>
    <text x="64" y="42" text-anchor="middle" fill="#FF9F0A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">TIER 2</text>
    <text x="132" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Standard Coding Models (Sonnet · Codex Standard · Pro Standard)</text>
    <text x="132" y="56" fill="#A1A1AA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">Feature implementation against locked decision spec · Multi-file edits · Scoped bug fixes</text>
    <rect x="938" y="20" width="140" height="32" rx="16" fill="#2A1F0D"/>
    <text x="1008" y="41" text-anchor="middle" fill="#FF9F0A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">~5x COST</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(52, 370)">
    <rect width="1096" height="72" rx="12" fill="#1A1214" stroke="#FF453A" stroke-width="1.4"/>
    <rect x="16" y="16" width="96" height="40" rx="8" fill="#2E1416" stroke="#FF453A" stroke-width="1.2"/>
    <text x="64" y="42" text-anchor="middle" fill="#FF453A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="800">TIER 3</text>
    <text x="132" y="34" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">Frontier Reasoning (Opus · High Reasoning · Pro High) — STRICTLY GATED</text>
    <text x="132" y="56" fill="#FCA5A5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">ONLY for architecture tradeoffs · security audit · OR bugs after 2 logged dead ends</text>
    <rect x="938" y="20" width="140" height="32" rx="16" fill="#2E1416"/>
    <text x="1008" y="41" text-anchor="middle" fill="#FF453A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="800">~15x+ GATED</text>
  </g>

  <!-- Bottom rule bar -->
  <text x="52" y="474" fill="#D4D4D8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    ESC GATE: Escalate only after 2 logged ledger deadend failures  ·  DE-ESCALATE: Lock decision in .occam/state.md &amp; drop back to T1/T2 immediately.
  </text>
</svg>
