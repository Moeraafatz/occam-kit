name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Audit agentskills.io compliance & startup token tax
        run: python3 scripts/occam.py audit skills --max-startup-tokens 350

      - name: Run unit and installer integration tests
        run: python3 -m unittest discover -s tests -v

      - name: Run reproducible offline benchmarks
        run: python3 benchmarks/run_benchmarks.py
